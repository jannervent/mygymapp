<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<meta name="theme-color" content="#0d0e10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Meu Treino</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0d0e10; --card:#17191c;
    --surface:rgba(255,255,255,.065); --surface-2:rgba(255,255,255,.11);
    --line:rgba(255,255,255,.08); --sep:rgba(255,255,255,.08); --sep-strong:rgba(255,255,255,.18);
    --text:#f3f4ee; --text-2:#979b90;
    --lime:#d6f45a; --on-lime:#14160a; --blue:#4560e8; --danger:#ff6b60;
    --radius:26px; --radius-sm:16px;
    --font:'Urbanist',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{ margin:0; padding:0; color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; min-height:100%; }
  body{ background:
      radial-gradient(120% 55% at 0% 0%, rgba(132,150,36,.26), transparent 62%),
      radial-gradient(90% 45% at 100% 100%, rgba(69,96,232,.16), transparent 65%),
      var(--bg);
    background-attachment:fixed; padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  button,input,textarea,select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }
  .hidden{ display:none !important; }

  /* ---- barra do topo ---- */
  #topbar{ position:sticky; top:0; z-index:10; padding:6px 16px;
    padding-top:calc(6px + env(safe-area-inset-top)); background:transparent; pointer-events:none; }
  #topbar:has(.back:not(.hidden)){ padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
    background:rgba(13,14,16,.42); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); pointer-events:auto; }
  #topbar-inner{ display:flex; align-items:center; gap:10px; min-height:8px; max-width:640px; margin:0 auto; }
  #topbar:has(.back:not(.hidden)) #topbar-inner{ min-height:40px; }
  #topbar .back{ background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; }
  #topbar .back svg{ width:18px; height:18px; }
  #topbar .title{ font-size:18px; font-weight:700; flex:1; text-align:center; margin:0 4px; }
  #topbar .side{ display:flex; align-items:center; gap:8px; min-width:40px; justify-content:flex-end; }

  #content{ padding:6px 16px calc(130px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; overflow-x:clip; }
  body{ overflow-x:hidden; }

  /* ---- títulos ---- */
  .page-title{ font-size:34px; font-weight:700; letter-spacing:-0.02em; line-height:1.1; margin:10px 2px 20px; }
  .section-title{ font-size:20px; font-weight:700; letter-spacing:-0.01em; margin:24px 4px 12px; }
  .section-title:first-child{ margin-top:2px; }
  .greet{ margin:8px 2px 22px; }
  .greet-hi{ font-size:16px; font-weight:600; color:var(--text-2); margin-bottom:6px; }
  .greet h1{ font-size:36px; font-weight:700; letter-spacing:-0.025em; line-height:1.08; margin:0; max-width:11em; text-wrap:balance; }

  /* ---- cartões de vidro e listas ---- */
  .list-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; margin-bottom:16px; }
  .list-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; }
  .list-row + .list-row{ border-top:1px solid var(--line); }
  .list-row.tap{ cursor:pointer; }
  .combo-connector{ display:flex; align-items:center; gap:8px; padding:0 16px 0 52px; margin-top:-2px; }
  .combo-connector::before{ content:""; width:2px; height:14px; background:var(--lime); margin-left:12px; border-radius:2px; }
  .combo-connector span{ font-size:12px; font-weight:700; color:var(--lime); }
  .icon-badge{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; color:#fff; flex-shrink:0; }
  .icon-badge svg{ width:17px; height:17px; }
  .list-row .titulo{ font-size:16.5px; font-weight:600; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-row .sub{ font-size:13px; color:var(--text-2); margin-top:2px; line-height:1.35; }
  .list-row .titulowrap{ flex:1; min-width:0; }
  .list-row .chev{ color:var(--text-2); display:flex; flex-shrink:0; }
  .list-row .chev svg{ width:16px; height:16px; }
  .row-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .row-actions .mini-btn, .refeicao-head .mini-btn{ background:var(--surface-2); border:none; color:var(--text-2);
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; cursor:pointer; }
  .row-actions .mini-btn svg, .refeicao-head .mini-btn svg{ width:15px; height:15px; }
  .row-actions .mini-btn.danger, .refeicao-head .mini-btn.danger{ color:var(--danger); }

  .treino-card{ margin-bottom:16px; touch-action:pan-y; }
  .treino-card > .list-card{ margin-bottom:0; }
  .treino-card.dragging{ opacity:.55; }
  .drag-handle{ display:flex; align-items:center; justify-content:center; width:22px; height:38px;
    flex-shrink:0; margin-left:-6px; color:var(--text-2); cursor:grab; touch-action:none; }
  .drag-handle svg{ width:16px; height:16px; }
  .ex-row{ touch-action:pan-y; }
  .ex-row.dragging{ opacity:.55; }
  .treino-expandido{ margin-top:10px; }
  .treino-expandido .list-card{ margin-bottom:10px; }

  .empty-state{ text-align:center; padding:56px 20px; color:var(--text-2); }
  .empty-state svg{ width:40px; height:40px; margin-bottom:14px; opacity:.4; }
  .empty-state p{ font-size:15px; line-height:1.55; margin:0 0 18px; }

  /* ---- botões ---- */
  .btn{ border-radius:999px; border:none; padding:15px 20px; font-size:16px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--lime); color:var(--on-lime); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-add{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:transparent; border:1.5px dashed var(--sep-strong); color:var(--text-2);
    border-radius:var(--radius); padding:16px; font-size:15px; font-weight:600;
    cursor:pointer; margin-top:8px; }
  .btn-add svg{ width:16px; height:16px; }

  /* ---- grade de treinos (tela Treinar) ---- */
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .tile{ position:relative; min-height:164px; border-radius:var(--radius); padding:16px;
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    display:flex; flex-direction:column; justify-content:flex-end; cursor:pointer; min-width:0; }
  .tile.ativo{ background:var(--blue); border-color:transparent; }
  .tile .go{ position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:50%;
    border:1px solid rgba(255,255,255,.24); display:flex; align-items:center; justify-content:center; color:var(--text); }
  .tile .go svg{ width:16px; height:16px; }
  .tile .estado{ align-self:flex-start; margin-bottom:10px; font-size:12px; font-weight:700;
    padding:4px 10px; border-radius:999px; background:var(--lime); color:var(--on-lime); }
  .tile .nome{ font-size:18px; font-weight:700; line-height:1.2; letter-spacing:-0.01em;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tile .sub{ font-size:13px; color:var(--text-2); margin-top:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile.ativo .sub{ color:rgba(255,255,255,.78); }

  /* ---- resumo da semana ---- */
  .hero-card{ background:var(--blue); border-radius:var(--radius); padding:18px; margin-bottom:16px; color:#fff; }
  .hero-top{ display:flex; align-items:baseline; gap:8px; margin-bottom:16px; }
  .hero-top .label{ font-weight:700; font-size:18px; flex:1; }
  .hero-top .count{ font-size:14px; font-weight:600; color:rgba(255,255,255,.78); }
  .dias-semana{ display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .dia-badge{ width:38px; height:38px; border-radius:50%; background:rgba(10,12,24,.55); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
  .dia-badge.treinou{ background:var(--lime); color:var(--on-lime); }
  .dia-badge.hoje{ box-shadow:0 0 0 2px #fff; }

  /* ---- cartões de exercício (tela do treino) ---- */
  .ex-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; }
  .ex-card.completo{ background:rgba(214,244,90,.12); border-color:rgba(214,244,90,.38); }
  .ex-card .ex-head{ display:flex; align-items:center; gap:10px; }
  .ex-card .ex-nome{ font-weight:700; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ex-card .ex-meta{ font-size:15.5px; color:var(--text-2); margin:5px 0 0 0; }
  .ex-card .ex-notas{ font-size:13px; color:var(--text-2); margin:8px 0 0 0; padding:8px 11px;
    background:rgba(255,255,255,.07); border-radius:12px; line-height:1.4; font-style:italic;
    white-space:pre-wrap; word-break:break-word; }
  .ex-combo-divisor{ height:1px; background:var(--line); margin:14px 0; }
  .combo-tag{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
    color:var(--lime); margin:0 0 12px 2px; }
  .combo-tag svg{ width:13px; height:13px; }
  .log-bloco{ touch-action:pan-y; }
  .log-bloco.dragging{ opacity:.55; }

  .check-btn{ background:transparent; border:1.5px solid var(--sep-strong); color:var(--text-2);
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:background .2s, color .2s, border-color .2s; }
  .check-btn svg{ width:19px; height:19px; }
  .check-btn.feito{ background:var(--lime); border-color:var(--lime); color:var(--on-lime); }
  .ex-edit-btn{ background:none; border:none; color:var(--text-2); width:32px; height:32px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .ex-edit-btn svg{ width:15px; height:15px; }

  /* ---- deslizar para editar / excluir ---- */
  .swipe-wrap{ position:relative; margin-bottom:14px; border-radius:var(--radius); }
  .swipe-wrap > .ex-card{ margin-bottom:0; border-radius:var(--radius); position:relative; z-index:1;
    transition:transform .25s cubic-bezier(.4,0,.2,1); will-change:transform; background:#1b1d21; }
  .swipe-wrap > .ex-card.completo{ background:#2a3318; }
  .swipe-wrap > .ex-card.no-transition{ transition:none !important; }
  .swipe-action{ position:absolute; top:0; bottom:0; width:84px; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius); opacity:0; pointer-events:none; transition:opacity .15s; }
  .swipe-wrap[data-lado="edit"] .swipe-edit, .swipe-wrap[data-lado="del"] .swipe-del{ opacity:1; pointer-events:auto; }
  .swipe-del{ left:0; background:#e5483d; }
  .swipe-edit{ right:0; background:var(--blue); }
  .swipe-action-btn{ background:none; border:none; color:#fff; font-size:12.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:8px; width:100%; }
  .swipe-action-btn svg{ width:22px; height:22px; }

  /* ---- navegação inferior ---- */
  #bottomnav{ position:fixed; left:0; right:0; margin:0 auto; bottom:calc(14px + env(safe-area-inset-bottom));
    width:fit-content; gap:22px; z-index:10; display:flex; justify-content:center; align-items:center;
    padding:8px; border-radius:999px; background:rgba(28,30,34,.84);
    -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    border:1px solid var(--line); box-shadow:0 16px 40px rgba(0,0,0,.55); }
  #bottomnav button{ width:56px; height:56px; border-radius:50%; border:none; background:var(--surface-2);
    color:#c7cabf; display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background-color .15s, color .15s; }
  #bottomnav button svg{ width:25px; height:25px; }
  #bottomnav button.active{ background:var(--lime); color:var(--on-lime); }

  /* ---- janelas (modais) ---- */
  #modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:30; display:flex; align-items:flex-end; }
  .modal{ background:var(--card); border:1px solid var(--line); border-bottom:none; width:100%; max-width:640px;
    margin:0 auto; border-radius:28px 28px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; }
  .modal-handle{ width:38px; height:5px; border-radius:3px; background:var(--sep-strong); margin:0 auto 14px; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-header span{ font-size:20px; font-weight:700; }
  .modal-header button{ background:var(--surface-2); border:none; color:var(--text); width:34px; height:34px;
    border-radius:50%; font-size:19px; cursor:pointer; line-height:1; }
  .modal-body label{ display:block; font-size:13px; color:var(--text-2); font-weight:600; margin:14px 0 7px; }
  .modal-body label:first-child{ margin-top:0; }
  .modal-body input, .modal-body textarea, .modal-body select{ width:100%; background:var(--surface);
    border:1px solid var(--line); color:var(--text); border-radius:var(--radius-sm); padding:13px 14px; font-size:16px; }
  .modal-body textarea{ resize:none; line-height:1.4; }
  .modal-body input::placeholder, .modal-body textarea::placeholder{ color:#6b6f66; }
  .modal-body option{ background:var(--card); color:var(--text); }
  .modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus{ outline:none; border-color:var(--lime); }
  .modal-body input + .row-2, .modal-body input + .row-3{ margin-top:14px; }
  .modal-body input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .modal-body input[type=number]::-webkit-inner-spin-button, .modal-body input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; gap:10px; margin-top:22px; }
  .modal-actions .btn{ flex:1; }
  .combo-bloco{ padding-top:6px; }
  .combo-bloco + .combo-bloco{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--sep-strong); }
  .combo-bloco-head{ display:flex; align-items:center; justify-content:space-between; }
  .combo-bloco-head span{ font-size:14px; font-weight:700; color:var(--lime); }
  .combo-bloco-head .mini-btn{ background:var(--surface-2); border:none; color:var(--text-2); width:28px; height:28px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .combo-bloco-head .mini-btn svg{ width:12px; height:12px; }
  .carga-label{ cursor:pointer; user-select:none; }
  .btn-add-combo{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    background:none; border:none; color:var(--lime); font-weight:700; font-size:14px; padding:12px 0 2px; cursor:pointer; }

  #confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:40;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .confirm-card{ background:var(--card); border:1px solid var(--line); width:100%; max-width:330px;
    border-radius:28px; padding:24px 20px; }
  .confirm-mensagem{ font-size:16px; font-weight:600; line-height:1.45; text-align:center; }
  .confirm-card .modal-actions{ margin-top:22px; }

  #toast{ position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--text); color:var(--on-lime); padding:11px 18px; 
    font-size:14px; font-weight:700; z-index:50; box-shadow:0 10px 26px rgba(0,0,0,.45); width:max-content; max-width:calc(100vw - 32px); text-align:center; line-height:1.35; border-radius:22px; }

  .footer-links{ text-align:center; margin-top:22px; padding-bottom:10px; }
  .footer-links a,.footer-links button{ color:var(--text-2); font-size:13px; background:none;
    border:none; text-decoration:underline; cursor:pointer; padding:6px; }

  /* ---- composição dos alimentos ---- */
  .comp-row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .comp-row input{ width:auto; padding:10px 12px; font-size:15px; }
  .comp-row .inp-nome{ flex:1; min-width:0; }
  .comp-row .inp-qtd{ width:84px; flex-shrink:0; }
  .comp-row .rem-comp{ background:var(--surface-2); border:none; color:var(--danger); width:30px; height:30px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .comp-row .rem-comp svg{ width:11px; height:11px; }
  .btn-add-comp{ background:none; border:none; color:var(--lime); font-weight:700; font-size:14px;
    padding:6px 0 2px; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .comp-lista-view{ margin-top:4px; }
  .comp-item-view{ font-size:12.5px; color:var(--text-2); padding:1px 0; }

  /* ---- dieta ---- */
  .totais-card{ background:var(--blue); border-radius:var(--radius); padding:18px; margin-bottom:16px; color:#fff; }
  .totais-card .topo{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .totais-card .topo .label{ font-weight:700; font-size:17px; flex:1; }
  .totais-card .kcal{ font-size:30px; font-weight:800; letter-spacing:-0.02em; }
  .totais-card .kcal span{ font-size:14px; font-weight:600; color:rgba(255,255,255,.78); margin-left:4px; }
  .macros-row{ display:flex; gap:8px; }
  .macro-box{ flex:1; border-radius:18px; padding:10px 8px; text-align:center; background:rgba(10,12,24,.4); }
  .macro-box .mv{ font-size:20px; font-weight:700; }
  .macro-box .mv span{ font-size:12px; font-weight:600; color:rgba(255,255,255,.7); }
  .macro-box .mk{ font-size:12.5px; font-weight:600; color:rgba(255,255,255,.78); margin-bottom:2px; }
  .refeicao-head{ display:flex; align-items:center; gap:8px; margin:22px 4px 12px; }
  .refeicao-head .rname{ flex:1; font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .refeicao-head .rkcal{ font-size:13px; font-weight:600; color:var(--text-2); }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  /* treino já executado na semana: card apagado */
  .tile .estado{ white-space:nowrap; }
  .tile .estado svg{ width:12px; height:12px; margin:-2px 5px 0 0; vertical-align:middle; }
  .tile.feito{ background:rgba(255,255,255,.025); border-color:rgba(255,255,255,.05); }
  .tile.feito .nome{ color:#767a6f; }
  .tile.feito .sub{ color:#5a5e54; }
  .tile.feito .go{ opacity:.3; }
  .tile.feito .estado{ background:rgba(255,255,255,.09); color:var(--text-2); }
  /* concluir treino */
  .btn-concluir{ display:block; width:100%; margin-top:16px; }
  .concluido-msg{ text-align:center; color:var(--lime); font-weight:700; margin-top:22px; }

  /* botão flutuante "+" (adicionar exercício) dentro do treino */
  .fab{ position:fixed; z-index:12; bottom:calc(102px + env(safe-area-inset-bottom));
    right:max(18px, calc((100vw - 640px) / 2 + 18px)); width:58px; height:58px; border-radius:50%;
    border:none; background:var(--lime); color:var(--on-lime); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
  .fab svg{ width:26px; height:26px; }
  .fab:active{ transform:scale(.94); }
  #content.tem-fab{ padding-bottom:calc(210px + env(safe-area-inset-bottom)); }

  /* próximo treino da sequência: selo discreto */
  .tile .estado.proximo{ background:transparent; border:1px solid var(--lime); color:var(--text-2); font-weight:600; }
  .btn-proximo{ display:block; width:100%; margin-top:10px; }
  .btn-proximo .btn-sub{ display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-top:2px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-inner">
    <button class="back hidden" id="btn-voltar" data-action="voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title" id="titulo-topo"></div>
    <div class="side" id="topo-acoes"></div>
  </div>
</div>

<div id="content"></div>

<div id="bottomnav">

<script>

var ICONS = {
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>',
  dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M4 4l3 3M17 17l3 3M9 4l-5 5 2 2 5-5-2-2zM20 15l-5 5-2-2 5-5 2 2z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2s-4 2-4 9v4M17 22v-7"/></svg>'
};

var CORES = ['#4560e8','#8b7cf6','#f59e5b','#3fc9b8','#ef6f8b','#4ea8f0'];
function corPara(txt){ var s=String(txt||''),h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return CORES[h%CORES.length]; }
function iconBadge(cor,svg,t){ var s=t||29; return '<div class="icon-badge" style="background:'+cor+';width:'+s+'px;height:'+s+'px;">'+svg+'</div>'; }
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}

// ============================================================
// ESTADO
// ============================================================
function hojeStr(){
  var d=new Date(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

var state = {
  ficha:{treinos:[]}, grupos:[], linkPlanilha:'',
  tab:'treinar', telaTreinar:'lista',
  treinoExpandidoId:null, treinoAtivoId:null,
  treinoChecks:{},
  modalTreinoId:null,
  modalExercicioId:null, modalExercicioTreinoId:null, modalCombo:[],
  modalExQuickId:null, modalExQuickTreinoId:null,
  dieta:{planos:[]}, planoExpandidoId:null,
  modalPlanoId:null,
  modalRefeicaoId:null, modalRefeicaoPlanoId:null,
  modalAlimentoId:null, modalAlimentoRefeicaoId:null, modalAlimentoPlanoId:null,
  modalAlimentoComponentes:[],
  execServidor:[],   // treinos executados, como estão na planilha
  pendentes:[],      // operações (concluir/desfazer) ainda não enviadas para a planilha
  andamento:null,    // treino em andamento: {treinoId, feitos:{idExercicio:true}, atualizado}
  andPendente:false, // há mudança do andamento que ainda não foi enviada para a planilha
  andVersao:0,
  carregando:true
};


// ============================================================
// PERSISTÊNCIA LOCAL (checks, treino em andamento, dias treinados)
// ============================================================
var NOME_USUARIO = 'Janner'; // nome exibido na saudação da tela Treinar
var LS_CHECKS = 'treinoChecks_v1';
var LS_ATIVO  = 'treinoAtivo_v1';
var MS_24H    = 86400000; // 24 horas em ms

function lsGet(k){ try{ var r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){return null;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// ============================================================
// TREINO EM ANDAMENTO — fica na planilha do Google (aba "Andamento"):
// qual treino foi começado e quais exercícios já foram marcados.
// O navegador guarda só uma cópia temporária do que ainda não foi enviado.
// ============================================================
var LS_AND_PEND = 'andamentoPendente_v1';

function andamentoValido(a){ return !!a && !!a.treinoId && (Date.now()-(a.atualizado||0)) <= MS_24H; }
function treinoEmAndamentoId(){ return andamentoValido(state.andamento) ? state.andamento.treinoId : null; }

// formato do app -> formato da planilha
function andamentoParaServidor(){
  var a=state.andamento; if(!a) return null;
  var t=findTreino(a.treinoId);
  return {treinoId:a.treinoId, treinoNome:t?t.nome:'',
    feitos:Object.keys(a.feitos).filter(function(k){ return a.feitos[k]; })};
}
// formato da planilha -> formato do app
function andamentoDoServidor(r){
  if(!r || !r.treinoId) return null;
  var f={}; (r.feitos||[]).forEach(function(id){ f[id]=true; });
  return {treinoId:r.treinoId, feitos:f, atualizado:r.atualizado||Date.now()};
}

// Mudou algo: guarda uma cópia no celular e envia para a planilha (juntando toques seguidos em um envio só)
var _tAnd=null, _enviandoAnd=false, _falhaAnd=false, _retryAnd=null;
function marcarAndamentoPendente(){
  state.andVersao++; state.andPendente=true;
  lsSet(LS_AND_PEND,{estado:andamentoParaServidor(), ts:Date.now()});
  clearTimeout(_tAnd); _tAnd=setTimeout(enviarAndamento,600);
}
// Sempre envia o estado completo, então repetir é seguro.
function enviarAndamento(){
  clearTimeout(_tAnd); clearTimeout(_retryAnd);
  if(!state.andPendente || _enviandoAnd) return Promise.resolve();
  _enviandoAnd=true;
  var versao=state.andVersao, estado=andamentoParaServidor();
  return gsCall('salvarAndamento',estado).then(function(){
    _enviandoAnd=false; _falhaAnd=false;
    if(versao===state.andVersao){ state.andPendente=false; lsDel(LS_AND_PEND); }
    else enviarAndamento();   // mudou enquanto enviava: manda o estado mais novo
  }).catch(function(err){
    console.error(err); _enviandoAnd=false;
    if(!_falhaAnd) toast(textoFalhaEnvio(err),6000);
    _falhaAnd=true; _retryAnd=setTimeout(enviarAndamento,8000);
  });
}

// Ao abrir o app: carrega o andamento da planilha (ou o que ficou sem enviar)
function iniciarAndamento(dados){
  state.andamento=andamentoDoServidor(dados.andamento);
  var pend=lsGet(LS_AND_PEND);
  if(pend){
    // havia mudança que ainda não tinha subido: ela é mais nova que a planilha
    state.andamento=pend.estado ? andamentoDoServidor({treinoId:pend.estado.treinoId, feitos:pend.estado.feitos, atualizado:pend.ts}) : null;
    state.andPendente=true; state.andVersao++;
  } else if(!state.andamento){
    // versão anterior guardava só no navegador: migra uma vez, se ainda estiver valendo
    var velhoA=lsGet(LS_ATIVO), velhoC=lsGet(LS_CHECKS);
    if(velhoA && velhoA.treinoId && (Date.now()-velhoA.ts)<=MS_24H && findTreino(velhoA.treinoId)){
      var f=(velhoC && velhoC.treinoId===velhoA.treinoId && (Date.now()-velhoC.ts)<=MS_24H) ? (velhoC.checks||{}) : {};
      state.andamento={treinoId:velhoA.treinoId, feitos:f, atualizado:Math.max(velhoA.ts,(velhoC&&velhoC.ts)||0)};
      marcarAndamentoPendente();
    }
  }
  lsDel(LS_ATIVO); lsDel(LS_CHECKS);
}

// marcou/desmarcou um exercício
function salvarChecks(){
  var id=state.treinoAtivoId;
  if(!id || treinoConcluidoHoje(id)) return;   // treino já concluído hoje não volta a ficar "em andamento"
  state.andamento={treinoId:id, feitos:state.treinoChecks, atualizado:Date.now()};
  marcarAndamentoPendente();
}
// "2 de 5 feitos" no card do treino em andamento
function progressoDoTreino(t){
  var f=(state.andamento && state.andamento.treinoId===t.id) ? state.andamento.feitos : {};
  var feitos=t.exercicios.filter(function(e){ return f[e.id]; }).length;
  return feitos+' de '+t.exercicios.length+' feitos';
}
// ============================================================
// TREINOS EXECUTADOS — ficam na planilha do Google (aba "Execucoes").
// O navegador guarda só uma fila temporária do que ainda não foi enviado
// (por exemplo, se o celular estiver sem internet na hora de concluir).
// ============================================================
var LS_PEND = 'execPendentes_v1';
var LS_CONCL = 'treinosConcluidos_v1';   // formato antigo (só no navegador): migrado para a planilha na abertura

function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function inicioDaSemanaIso(){
  var h=new Date();
  return isoLocal(new Date(h.getFullYear(),h.getMonth(),h.getDate()-h.getDay()));
}
function persistirPendentes(){
  if(state.pendentes.length) lsSet(LS_PEND,state.pendentes); else lsDel(LS_PEND);
}
// aplica as operações pendentes por cima da lista da planilha (o app já mostra o resultado antes do envio terminar)
function aplicarOps(lista,ops){
  var out=lista.slice();
  ops.forEach(function(o){
    if(o.op==='add'){
      if(!out.some(function(e){ return e.treinoId===o.t && e.data===o.d; }))
        out.push({id:'pendente',data:o.d,treinoId:o.t,treinoNome:o.n||''});
    } else {
      out=out.filter(function(e){ return !(e.treinoId===o.t && e.data===o.d); });
    }
  });
  return out;
}
function execucoes(){ return aplicarOps(state.execServidor,state.pendentes); }

function carregarDiasTreinados(){
  var vistos={}, dias=[];
  execucoes().forEach(function(e){ if(!vistos[e.data]){ vistos[e.data]=true; dias.push(e.data); } });
  return dias;
}
// Data (AAAA-MM-DD) da conclusão mais recente do treino dentro da semana atual, ou null
function ultimaConclusaoNaSemana(id){
  var ini=inicioDaSemanaIso(), ultima=null;
  execucoes().forEach(function(e){
    if(e.treinoId===id && e.data>=ini && (!ultima || e.data>ultima)) ultima=e.data;
  });
  return ultima;
}
var NOMES_DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function nomeDoDia(iso){ return NOMES_DIAS[new Date(iso+'T00:00:00').getDay()]; }
function treinoConcluidoHoje(id){
  var hoje=hojeStr();
  return execucoes().some(function(e){ return e.treinoId===id && e.data===hoje; });
}
// ---- sequência de treinos ----
// A ordem é a dos treinos na planilha (a mesma dos cards na tela inicial).
// O próximo é o que vem depois do treino de referência, pulando os que já foram
// executados nesta semana; depois do último, volta para o primeiro.
function proximoTreinoDe(refId){
  var lista=state.ficha.treinos;
  if(lista.length<2) return null;
  var i=lista.findIndex(function(t){ return t.id===refId; });   // -1 se não houver referência: começa pelo primeiro
  for(var k=1;k<=lista.length;k++){
    var t=lista[(i+k)%lista.length];
    if(t.id===refId) continue;
    if(!ultimaConclusaoNaSemana(t.id)) return t.id;
  }
  var seguinte=lista[(i+1)%lista.length];   // todos já foram feitos nesta semana: segue a ordem mesmo assim
  return seguinte.id===refId ? null : seguinte.id;
}
// Referência da tela inicial: o treino em andamento ou, se não houver, o último treino concluído
function treinoReferenciaId(){
  var lista=state.ficha.treinos;
  var andamento=treinoEmAndamentoId();
  if(andamento && findTreino(andamento)) return andamento;
  var ultimo=null, ultimaData='', ultimoIdx=-1;
  execucoes().forEach(function(e){
    var idx=lista.findIndex(function(t){ return t.id===e.treinoId; });
    if(idx<0) return;
    if(e.data>ultimaData || (e.data===ultimaData && idx>ultimoIdx)){ ultimo=e.treinoId; ultimaData=e.data; ultimoIdx=idx; }
  });
  return ultimo;
}

function registrarConclusao(id){
  var t=findTreino(id);
  state.pendentes.push({op:'add',t:id,d:hojeStr(),n:t?t.nome:''});
  persistirPendentes();
  enviarExecucoes();
}
function removerConclusaoHoje(id){
  state.pendentes.push({op:'del',t:id,d:hojeStr()});
  persistirPendentes();
  enviarExecucoes();
}

// Envia a fila para a planilha. É seguro repetir (o servidor não duplica),
// então se a conexão cair o app tenta de novo sozinho.
var _enviandoExec=false, _retryExec=null, _falhaExec=false;
function enviarExecucoes(){
  if(_enviandoExec || state.pendentes.length===0) return Promise.resolve();
  _enviandoExec=true; clearTimeout(_retryExec);
  var qtd=state.pendentes.length, lote=state.pendentes.slice(0,qtd);
  return gsCall('sincronizarExecucoes',lote).then(function(lista){
    state.execServidor=lista;
    state.pendentes=state.pendentes.slice(qtd);   // o que foi feito durante o envio continua na fila
    persistirPendentes();
    _falhaExec=false; _enviandoExec=false;
    if(state.pendentes.length) return enviarExecucoes();
    if(state.tab==='treinar' && state.telaTreinar==='lista') render();
  }).catch(function(err){
    console.error(err);
    _enviandoExec=false;
    if(!_falhaExec) toast(textoFalhaEnvio(err),6000);
    _falhaExec=true;
    _retryExec=setTimeout(enviarExecucoes,8000);
  });
}

// Treinos concluídos que estavam só no navegador (versão anterior) vão para a planilha uma única vez
function migrarConclusoesAntigas(){
  lsDel('diasTreinados_v1');
  var antigos=lsGet(LS_CONCL);
  if(antigos && antigos.length){
    antigos.forEach(function(c){
      if(!c || !c.t || !c.d) return;
      var t=findTreino(c.t);
      state.pendentes.push({op:'add',t:c.t,d:c.d,n:t?t.nome:''});
    });
    persistirPendentes();   // primeiro garante a fila salva, depois apaga o formato antigo
  }
  lsDel(LS_CONCL);
}

function limparEstadoDoTreino(id){
  if(state.andamento && state.andamento.treinoId===id){ state.andamento=null; marcarAndamentoPendente(); }
}

function findTreino(id){ return state.ficha.treinos.filter(function(t){return t.id===id;})[0]; }

async function gsCall(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(MEU_TREINO_API_URL)) {
    throw new Error('Configure o endereço /exec do Apps Script em config.js.');
  }
  var response = await fetch(MEU_TREINO_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: JSON.stringify({ fn: fn, args: args })
  });
  if (!response.ok) throw new Error('Falha ao acessar o Apps Script (' + response.status + ').');
  var result = await response.json();
  if (!result.ok) throw new Error(result.error || 'O Apps Script devolveu um erro.');
  return result.data;
}
function toast(msg,ms){ var el=document.getElementById('toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.add('hidden');},ms||1800); }
// texto do aviso quando não deu para salvar na planilha: sem internet de verdade, ou o motivo real devolvido pelo servidor
function textoFalhaEnvio(err){
  if(typeof navigator!=='undefined' && navigator.onLine===false) return 'Sem conexão com a internet — vou tentar salvar de novo';
  var m=String((err&&err.message)||err||'erro desconhecido').replace(/^(Error|Exception):\s*/,'').slice(0,160);
  return 'Não consegui salvar na planilha: '+m;
}
function erroBackend(err){ console.error(err); toast('Ops, deu erro: '+(err&&err.message?err.message:'tenta de novo')); }

function isoLocal(d){

  var dias=carregarDiasTreinados();

  var nomes=['D','S','T','Q','Q','S','S'], total=0;

// ============================================================
// SWIPE — gestos de deslizar nos cards
// ============================================================
var _swp=null, SWP_THRESHOLD=50, SWP_MAX=94;   // 84px do botão + 10px de respiro entre o card e o botão

document.addEventListener('touchstart',function(e){
  if(e.target.closest('[data-action="drag-handle-log"]')){ closeAllSwipes(); return; }
  var wrap=e.target.closest('.swipe-wrap');
  if(!wrap){ closeAllSwipes(); return; }
  closeAllSwipes(wrap);
  var card=wrap.querySelector(':scope > .ex-card'); if(!card) return;
  _swp={ wrap:wrap, card:card, x0:e.touches[0].clientX, y0:e.touches[0].clientY, dx:0, dir:null };
},{passive:true});

document.addEventListener('touchmove',function(e){
  if(!_swp) return;
  var dx=e.touches[0].clientX-_swp.x0, dy=e.touches[0].clientY-_swp.y0;
  if(_swp.dir===null){
    if(Math.abs(dx)<5&&Math.abs(dy)<5) return;
    _swp.dir=Math.abs(dx)>Math.abs(dy)?'h':'v';
  }
  if(_swp.dir==='v'){ _swp=null; return; }
  e.preventDefault();
  _swp.dx=dx;
  var tx=Math.max(-SWP_MAX,Math.min(SWP_MAX,dx));
  _swp.card.classList.add('no-transition');
  _swp.card.style.transform='translateX('+tx+'px)';
  if(tx!==0) _swp.wrap.dataset.lado=tx<0?'edit':'del';   // só mostra o botão do lado para onde o card está indo
},{passive:false});

document.addEventListener('touchend',function(){
  if(!_swp) return;
  var dx=_swp.dx, card=_swp.card, wrap=_swp.wrap;
  card.classList.remove('no-transition');
  if(dx<-SWP_THRESHOLD){
    card.style.transform='translateX(-'+SWP_MAX+'px)';
    wrap.dataset.swipeOpen='edit';
  } else if(dx>SWP_THRESHOLD){
    card.style.transform='translateX('+SWP_MAX+'px)';
    wrap.dataset.swipeOpen='del';
  } else {
    card.style.transform='';
    delete wrap.dataset.swipeOpen;
    esconderLadoDoSwipe(wrap);
  }
  _swp=null;
});

// some com o botão (editar/excluir) depois que o card terminou de voltar ao lugar
function esconderLadoDoSwipe(w){
  setTimeout(function(){ if(!w.dataset.swipeOpen) delete w.dataset.lado; },280);
}


// ============================================================
// DRAG & DROP — reordenar exercícios na tela de treino
// ============================================================
var _dragLog=null;

function iniciarDragLog(ev,exId){
  if(ev.pointerType==='mouse'&&ev.button!==0) return;
  ev.preventDefault();
  closeAllSwipes();
  var el=document.querySelector('.log-bloco[data-ex-id="'+exId+'"]'); if(!el) return;
  _dragLog={exId:exId,el:el,mudou:false};
  el.classList.add('dragging');
  document.addEventListener('pointermove',moverDragLog);
  document.addEventListener('pointerup',soltarDragLog);
  document.addEventListener('pointercancel',soltarDragLog);
}

function moverDragLog(ev){
  if(!_dragLog) return;
  var blocos=Array.prototype.slice.call(document.querySelectorAll('#content .log-bloco'));
  var cur=document.querySelector('.log-bloco[data-ex-id="'+_dragLog.exId+'"]'); if(!cur) return;
  var idx=blocos.indexOf(cur);
  if(idx>0){var r=blocos[idx-1].getBoundingClientRect(); if(ev.clientY<r.top+r.height/2){trocarBlocosLog(_dragLog.exId,blocos[idx-1].dataset.exId);return;}}
  if(idx<blocos.length-1){var r2=blocos[idx+1].getBoundingClientRect(); if(ev.clientY>r2.top+r2.height/2){trocarBlocosLog(_dragLog.exId,blocos[idx+1].dataset.exId);return;}}
}

function trocarBlocosLog(exIdA,exIdB){
  var t=findTreino(state.treinoAtivoId); if(!t) return;
  var blocos=agruparPorCombo(t.exercicios);
  var iA=blocos.findIndex(function(b){return b[0].id===exIdA;});
  var iB=blocos.findIndex(function(b){return b[0].id===exIdB;});
  if(iA===-1||iB===-1) return;
  var tmp=blocos[iA]; blocos[iA]=blocos[iB]; blocos[iB]=tmp;
  t.exercicios=[];
  blocos.forEach(function(b){b.forEach(function(ex){t.exercicios.push(ex);});});
  _dragLog.mudou=true;
  render();
  var el=document.querySelector('.log-bloco[data-ex-id="'+exIdA+'"]');
  if(el) el.classList.add('dragging');
}

function soltarDragLog(){
  if(!_dragLog) return;
  var exId=_dragLog.exId, mudou=_dragLog.mudou;
  document.removeEventListener('pointermove',moverDragLog);
  document.removeEventListener('pointerup',soltarDragLog);
  document.removeEventListener('pointercancel',soltarDragLog);
  _dragLog=null;
  var el=document.querySelector('.log-bloco[data-ex-id="'+exId+'"]');
  if(el) el.classList.remove('dragging');
  if(mudou){
    var t=findTreino(state.treinoAtivoId);
    if(t){
      var ids=t.exercicios
        .filter(function(e){return String(e.id).indexOf('tmp-')!==0;})
        .map(function(e){return e.id;});
      gsCall('reordenarExercicios',ids).catch(erroBackend);
    }
  }
}

function closeAllSwipes(except){
  document.querySelectorAll('.swipe-wrap[data-swipe-open]').forEach(function(w){
    if(w===except) return;
    var c=w.querySelector(':scope > .ex-card');
    if(c) c.style.transform='';
    delete w.dataset.swipeOpen;
    esconderLadoDoSwipe(w);
  });
}

  var blocos=state.modalCombo.filter(function(b){return b.nome.trim()!=='';});
  if(!grupo||blocos.length===0){toast('Preenche grupo muscular e nome');return;}

    return{id:(i===0?state.modalExercicioId:null),treinoId:state.modalExercicioTreinoId,
      grupoMuscular:grupo,nome:b.nome.trim(),series:Number(b.series)||0,
      repeticoes:String(b.repeticoes||'').trim(),

function calcMacrosRefeicao(r){
  var t={cal:0,prot:0,carb:0,gord:0,temDados:false};
  r.alimentos.forEach(function(a){
    if(a.calorias!==''&&a.calorias!=null){t.cal+=Number(a.calorias)||0;t.temDados=true;}
    if(a.proteinas!==''&&a.proteinas!=null) t.prot+=Number(a.proteinas)||0;
    if(a.carboidratos!==''&&a.carboidratos!=null) t.carb+=Number(a.carboidratos)||0;
    if(a.gorduras!==''&&a.gorduras!=null) t.gord+=Number(a.gorduras)||0;
  }); return t;
}
function calcMacrosPlano(p){
  var t={cal:0,prot:0,carb:0,gord:0,temDados:false};
  p.refeicoes.forEach(function(r){ var rt=calcMacrosRefeicao(r);
    if(rt.temDados){t.temDados=true;t.cal+=rt.cal;t.prot+=rt.prot;t.carb+=rt.carb;t.gord+=rt.gord;} });
  return t;
}

        });
        html+='<button class="btn-add" data-action="nova-refeicao" data-plano="'+p.id+'">'+ICONS.plus+' Adicionar refeição</button></div>';
      }
      html+='</div>';
    });
  }
  html+='<button class="btn-add" data-action="novo-plano">'+ICONS.plus+' Novo plano alimentar</button>';
  html+='<div class="footer-links">'+(state.linkPlanilha?'<a href="'+state.linkPlanilha+'" target="_blank">abrir planilha de dados</a> · ':'')+
    '<button data-action="limpar-cache">limpar cache</button></div>';

function editarPlano(id){ var p=findPlano(id); if(!p) return; state.modalPlanoId=id; document.getElementById('modal-title').textContent='Editar plano'; document.getElementById('input-plano-nome').value=p.nome; abrirModal('plano'); }
function confirmarPlano(){ var nome=document.getElementById('input-plano-nome').value.trim(); if(!nome){toast('Dá um nome pro plano');return;} var dados={id:state.modalPlanoId,nome:nome}; fecharModal(); gsCall('salvarPlano',dados).then(function(res){state.dieta=res.dieta;if(!dados.id)state.planoExpandidoId=res.id;render();}).catch(function(err){erroBackend(err);reverterDietaDoServidor();}); }
function excluirPlano(id){ confirmPopup('Excluir esse plano e todas as refeições e alimentos?','Excluir').then(function(ok){ if(!ok) return; state.dieta.planos=state.dieta.planos.filter(function(p){return p.id!==id;}); if(state.planoExpandidoId===id) state.planoExpandidoId=null; render(); gsCall('excluirPlano',id).then(function(res){state.dieta=res.dieta;render();}).catch(function(err){erroBackend(err);reverterDietaDoServidor();}); }); }
function novaRefeicao(planoId){ state.modalRefeicaoId=null; state.modalRefeicaoPlanoId=planoId; document.getElementById('modal-title').textContent='Nova refeição'; document.getElementById('input-refeicao-nome').value=''; abrirModal('refeicao'); setTimeout(function(){document.getElementById('input-refeicao-nome').focus();},50); }
function editarRefeicao(id,planoId){ var p=findPlano(planoId),r=p?findRefeicao(p,id):null; if(!r) return; state.modalRefeicaoId=id; state.modalRefeicaoPlanoId=planoId; document.getElementById('modal-title').textContent='Editar refeição'; document.getElementById('input-refeicao-nome').value=r.nome; abrirModal('refeicao'); }
function confirmarRefeicao(){ var nome=document.getElementById('input-refeicao-nome').value.trim(); if(!nome){toast('Dá um nome pra refeição');return;} var dados={id:state.modalRefeicaoId,planoId:state.modalRefeicaoPlanoId,nome:nome}; fecharModal(); gsCall('salvarRefeicao',dados).then(function(res){state.dieta=res.dieta;render();}).catch(function(err){erroBackend(err);reverterDietaDoServidor();}); }
function excluirRefeicao(id){ confirmPopup('Excluir essa refeição e todos os alimentos?','Excluir').then(function(ok){ if(!ok) return; state.dieta.planos.forEach(function(p){p.refeicoes=p.refeicoes.filter(function(r){return r.id!==id;});}); render(); gsCall('excluirRefeicao',id).then(function(res){state.dieta=res.dieta;render();}).catch(function(err){erroBackend(err);reverterDietaDoServidor();}); }); }

function renderModalComponentes(){ var html=state.modalAlimentoComponentes.map(function(c,i){ return '<div class="comp-row"><input type="text" class="inp-nome" data-idx="'+i+'" placeholder="Ex: Queijo" value="'+escapeHtml(c.nome||'')+'"><input type="text" class="inp-qtd" data-idx="'+i+'" placeholder="30g" value="'+escapeHtml(c.quantidade||'')+'"><button type="button" class="rem-comp" data-action="rem-componente" data-idx="'+i+'">'+ICONS.x+'</button></div>'; }).join(''); var el=document.getElementById('componentes-lista'); if(el) el.innerHTML=html; }
function sincronizarComponentesDoDOM(){ state.modalAlimentoComponentes.forEach(function(c,i){ var ne=document.querySelector('.inp-nome[data-idx="'+i+'"]'),qe=document.querySelector('.inp-qtd[data-idx="'+i+'"]'); if(ne)c.nome=ne.value; if(qe)c.quantidade=qe.value; }); }
function adicionarComponente(){ sincronizarComponentesDoDOM(); state.modalAlimentoComponentes.push({nome:'',quantidade:''}); renderModalComponentes(); var idx=state.modalAlimentoComponentes.length-1; setTimeout(function(){var el=document.querySelector('.inp-nome[data-idx="'+idx+'"]');if(el)el.focus();},50); }
function removerComponente(idx){ sincronizarComponentesDoDOM(); state.modalAlimentoComponentes.splice(idx,1); renderModalComponentes(); }

function novoAlimento(refeicaoId,planoId){ state.modalAlimentoId=null; state.modalAlimentoRefeicaoId=refeicaoId; state.modalAlimentoPlanoId=planoId; state.modalAlimentoComponentes=[]; document.getElementById('modal-title').textContent='Novo alimento'; ['input-alimento-nome','input-alimento-qtd','input-alimento-cal','input-alimento-prot','input-alimento-carb','input-alimento-gord'].forEach(function(id){document.getElementById(id).value='';}); document.getElementById('input-alimento-unidade').value='g'; renderModalComponentes(); abrirModal('alimento'); setTimeout(function(){document.getElementById('input-alimento-nome').focus();},50); }
function editarAlimento(id,refeicaoId,planoId){ var p=findPlano(planoId),r=p?findRefeicao(p,refeicaoId):null,a=r?findAlimento(r,id):null; if(!a) return;
  state.modalAlimentoId=id; state.modalAlimentoRefeicaoId=refeicaoId; state.modalAlimentoPlanoId=planoId;
  state.modalAlimentoComponentes=(a.componentes||[]).map(function(c){return{nome:c.nome||'',quantidade:c.quantidade||''};});
  document.getElementById('modal-title').textContent='Editar alimento';
  document.getElementById('input-alimento-nome').value=a.nome||''; document.getElementById('input-alimento-qtd').value=a.quantidade!==''?a.quantidade:'';
  document.getElementById('input-alimento-unidade').value=a.unidade||'g';
  document.getElementById('input-alimento-cal').value=a.calorias!==''?a.calorias:''; document.getElementById('input-alimento-prot').value=a.proteinas!==''?a.proteinas:''; document.getElementById('input-alimento-carb').value=a.carboidratos!==''?a.carboidratos:''; document.getElementById('input-alimento-gord').value=a.gorduras!==''?a.gorduras:'';
  renderModalComponentes(); abrirModal('alimento'); }
function confirmarAlimento(){ var nome=document.getElementById('input-alimento-nome').value.trim(); if(!nome){toast('Preenche o nome do alimento');return;} sincronizarComponentesDoDOM();
  var comp=state.modalAlimentoComponentes.filter(function(c){return c.nome&&c.nome.trim()!=='';}).map(function(c){return{nome:c.nome.trim(),quantidade:c.quantidade||''};});
  function nv(id){var v=document.getElementById(id).value;return v!==''?Number(v):'';}
  var dados={id:state.modalAlimentoId,refeicaoId:state.modalAlimentoRefeicaoId,nome:nome,quantidade:nv('input-alimento-qtd'),unidade:document.getElementById('input-alimento-unidade').value||'g',calorias:nv('input-alimento-cal'),proteinas:nv('input-alimento-prot'),carboidratos:nv('input-alimento-carb'),gorduras:nv('input-alimento-gord'),componentes:comp};
  fecharModal(); gsCall('salvarAlimento',dados).then(function(res){state.dieta=res.dieta;render();}).catch(function(err){erroBackend(err);reverterDietaDoServidor();}); }
function excluirAlimento(id){ confirmPopup('Excluir esse alimento?','Excluir').then(function(ok){ if(!ok) return; state.dieta.planos.forEach(function(p){p.refeicoes.forEach(function(r){r.alimentos=r.alimentos.filter(function(a){return a.id!==id;});});}); render(); gsCall('excluirAlimento',id).then(function(res){state.dieta=res.dieta;render();}).catch(function(err){erroBackend(err);reverterDietaDoServidor();}); }); }
function reverterDietaDoServidor(){ gsCall('getDietaCompleta').then(function(d){state.dieta=d;render();}).catch(function(){}); }

// modals util
function abrirModal(tipo){
  ['treino','exercicio','ex-quick','plano','refeicao','alimento'].forEach(function(t){
    document.getElementById('modal-body-'+t).classList.toggle('hidden',t!==tipo);
  });
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function fecharModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }
function confirmPopup(mensagem,textoConfirmar){ return new Promise(function(resolve){
  document.getElementById('confirm-mensagem').textContent=mensagem;
  var btnOk=document.getElementById('confirm-btn-ok'); btnOk.textContent=textoConfirmar||'Confirmar';
  document.getElementById('confirm-overlay').classList.remove('hidden');
  document.getElementById('confirm-btn-cancelar').onclick=function(){document.getElementById('confirm-overlay').classList.add('hidden');resolve(false);};
  btnOk.onclick=function(){document.getElementById('confirm-overlay').classList.add('hidden');resolve(true);}; }); }
function limparCache(){ gsCall('limparCache').then(function(){toast('Cache limpo');}).catch(erroBackend); }

// ============================================================
// DELEGAÇÃO DE EVENTOS
// ============================================================
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]'); if(!el) return;
  var action=el.dataset.action;
  switch(action){
    case 'ir-tab':              irTab(el.dataset.tab); break;
    case 'voltar':              voltar(); break;
    case 'abrir-treino':        abrirTreino(el.dataset.id); break;
    case 'check-exercicio':
      state.treinoChecks[el.dataset.id]=!state.treinoChecks[el.dataset.id];
      el.classList.toggle('feito',!!state.treinoChecks[el.dataset.id]);
      var card=el.closest('.ex-card'); if(card){ var btns=card.querySelectorAll('.check-btn'); var allDone=Array.prototype.slice.call(btns).every(function(b){return b.classList.contains('feito');}); card.classList.toggle('completo',allDone); }
      salvarChecks(); // persiste no localStorage (expira em 24h)
      break;
    case 'editar-ex-quick':     editarExQuick(el.dataset.id,el.dataset.treino); break;
    case 'confirmar-ex-quick':  confirmarExQuick(); break;
    case 'excluir-ex-log':      closeAllSwipes(); excluirExercicio(el.dataset.id); break;
    case 'novo-ex-log':         novoExercicio(state.treinoAtivoId); break;
    case 'concluir-treino':     concluirTreino(); break;
    case 'iniciar-proximo':     iniciarProximoTreino(el.dataset.id); break;
    case 'desfazer-conclusao':  desfazerConclusao(); break;
    case 'expandir-treino':     state.treinoExpandidoId=(state.treinoExpandidoId===el.dataset.id)?null:el.dataset.id; render(); break;
    case 'novo-treino':         novoTreino(); break;
    case 'editar-treino':       editarTreino(el.dataset.id); break;
    case 'excluir-treino':      excluirTreino(el.dataset.id); break;
    case 'novo-exercicio':      novoExercicio(el.dataset.treino); break;
    case 'editar-exercicio':    editarExercicio(el.dataset.id,el.dataset.treino); break;
    case 'excluir-exercicio':   excluirExercicio(el.dataset.id); break;
    case 'confirmar-treino':    confirmarTreino(); break;
    case 'confirmar-exercicio': confirmarExercicio(); break;
    case 'adicionar-combo':     adicionarExercicioCombo(); break;
    case 'remover-combo':       removerExercicioCombo(Number(el.dataset.idx)); break;
    case 'alternar-tipo-carga': alternarTipoCargaCombo(Number(el.dataset.idx)); break;
    case 'alternar-tipo-carga-eq': alternarTipoCargaEq(); break;
    case 'fechar-modal':        fecharModal(); break;
    case 'limpar-cache':        limparCache(); break;
    case 'expandir-plano':      state.planoExpandidoId=(state.planoExpandidoId===el.dataset.id)?null:el.dataset.id; render(); break;
    case 'novo-plano':          novoPlano(); break;
    case 'editar-plano':        editarPlano(el.dataset.id); break;
    case 'excluir-plano':       excluirPlano(el.dataset.id); break;
    case 'nova-refeicao':       novaRefeicao(el.dataset.plano); break;
    case 'editar-refeicao':     editarRefeicao(el.dataset.id,el.dataset.plano); break;
    case 'excluir-refeicao':    excluirRefeicao(el.dataset.id); break;
    case 'novo-alimento':       novoAlimento(el.dataset.refeicao,el.dataset.plano); break;
    case 'editar-alimento':     editarAlimento(el.dataset.id,el.dataset.refeicao,el.dataset.plano); break;
    case 'excluir-alimento':    excluirAlimento(el.dataset.id); break;
    case 'confirmar-plano':     confirmarPlano(); break;
    case 'confirmar-refeicao':  confirmarRefeicao(); break;
    case 'confirmar-alimento':  confirmarAlimento(); break;
    case 'add-componente':      adicionarComponente(); break;
    case 'rem-componente':      removerComponente(Number(el.dataset.idx)); break;
  }
});

document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tile')){ e.preventDefault(); e.target.click(); }
});

document.addEventListener('pointerdown',function(e){
  var elT=e.target.closest('[data-action="drag-handle"]'); if(elT){iniciarDragTreino(e,elT.dataset.id);return;}
  var elE=e.target.closest('[data-action="drag-handle-ex"]'); if(elE){iniciarDragExercicio(e,elE.dataset.treino,elE.dataset.id);return;}
  var elL=e.target.closest('[data-action="drag-handle-log"]'); if(elL){iniciarDragLog(e,elL.dataset.id);return;}
});

document.addEventListener('visibilitychange',function(){
  if(document.hidden){ enviarAndamento(); }                      // saiu do app: envia na hora o que ainda não subiu
  else { enviarExecucoes(); enviarAndamento(); }
});

init();

</script>
